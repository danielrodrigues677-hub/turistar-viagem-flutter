name: turistar_viagem
description: Plataforma de viagens Turistar - Voos, Hotéis, Carros e Seguros
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Navigation
  go_router: ^10.0.0
  
  # UI Components
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  
  # Forms & Validation
  reactive_forms: ^16.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Payment
  stripe_flutter: ^10.0.0
  
  # Authentication
  firebase_core: ^2.24.0
  firebase_auth: ^4.10.0
  google_sign_in: ^6.1.0
  
  # Analytics
  firebase_analytics: ^10.7.0
  
  # Notifications
  firebase_messaging: ^14.6.0
  
  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
