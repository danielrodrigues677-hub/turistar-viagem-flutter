name: turistar_viagem
description: Plataforma de viagens Turistar - Voos, Hotéis, Carros e Seguros
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.0
  
  # Navigation
  go_router: ^10.0.0
  
  # UI Components
  google_fonts: ^6.0.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  
  # Forms & Validation
  reactive_forms: ^16.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Payment
  # stripe_flutter: ^10.0.0  # package not available on pub.dev
  
  # Authentication (disabled - incompatible with Dart 3.5, re-enable with updated versions when needed)
  # firebase_core: ^2.24.0
  # firebase_auth: ^4.10.0
  # google_sign_in: ^6.1.0
  
  # Analytics (disabled - incompatible with Dart 3.5)
  # firebase_analytics: ^10.7.0
  
  # Notifications (disabled - incompatible with Dart 3.5)
  # firebase_messaging: ^14.6.0
  
  # Logging
  logger: ^2.0.0
  
  # Glass Morphism & Effects
  glassmorphism: ^3.0.0
  # backdrop_filter: ^0.4.0  # package not available on pub.dev
  
  # Animations
  lottie: ^2.4.0
  shimmer: ^3.0.0
  flutter_animate: ^4.2.0
  
  # UI Enhancements
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  get_it: ^7.6.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
  
  # Fonts are loaded via google_fonts package at runtime
  # fonts:
  #   - family: Poppins
